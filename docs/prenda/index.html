<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prenda · Estudio Soler</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Geolocalización de vehículos prendados con consentimiento del tomador: mapa, alertas y constancias. Estudio Soler.">
<!-- Solo se cargan archivos de la propia app; lo único externo es la base de datos y sus funciones (Supabase). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://udfmoxnehgoihzsyrpvy.supabase.co wss://udfmoxnehgoihzsyrpvy.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1823">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prenda">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="vArranque" class="arranque">Abriendo Prenda…</div>

<main id="vIngreso" class="portada" hidden>
  <section class="caratula" aria-labelledby="tIngreso">
    <div>
      <h1 id="tIngreso"><span class="j">P</span>renda</h1>
      <div class="estudio">Estudio Soler</div>
    </div>
    <div id="ingresoCuerpo" class="caratula-cuerpo"></div>
  </section>
</main>

<div id="vApp" hidden>
  <div class="app">
    <!-- En la computadora, la barra lateral. En el celular solo quedan las vistas, debajo del encabezado. -->
    <div class="lateral">
      <div class="marca" aria-hidden="true"><span class="marca-j">P</span><span class="marca-txt">renda</span><small>Estudio Soler</small></div>
      <div class="seg" id="vistas" role="group" aria-label="Vista">
        <button id="v_mapa" aria-pressed="true"><span class="vista-txt">Mapa</span></button>
        <button id="v_vehiculos" aria-pressed="false"><span class="vista-txt">Vehículos</span></button>
        <button id="v_alertas" aria-pressed="false"><span class="vista-txt">Alertas</span><span class="badge" id="nAlertas" hidden></span></button>
        <button id="v_bitacora" aria-pressed="false"><span class="vista-txt">Bitácora</span></button>
      </div>
      <a class="otra-app" href="../" target="_blank" rel="noopener"><span class="otra-j">J</span><span class="otra-txt">Juicios</span></a>
    </div>

    <div class="wrap">
      <header>
        <div class="titulos">
          <h1><span class="h-marca"><span class="j">P</span>renda</span><span class="h-vista" id="tVista">Mapa</span></h1>
          <div class="sub" id="sub"></div>
        </div>
        <div class="actions">
          <button class="cuenta" id="btnCuenta" aria-haspopup="menu" aria-expanded="false" aria-label="Cuenta y opciones"></button>
        </div>
        <div class="pildoras solo-escritorio">
          <button class="btn primary" id="btnNuevo">+ Nuevo vehículo</button>
          <button class="btn" id="btnAjustes">Ajustes</button>
        </div>
      </header>

      <div id="franja"></div>

      <main id="main"></main>
    </div>
  </div>
  <button class="btn primary fab" id="fabNuevo">+ Nuevo vehículo</button>
</div>

<div id="drawer" hidden></div>
<div id="menu" hidden></div>
<div id="hoja" hidden><div class="hoja" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript>La app Prenda necesita JavaScript para funcionar.</noscript>
<script src="../vendor/supabase.js"></script>
<script src="../config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

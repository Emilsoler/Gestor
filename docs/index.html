<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juicios · Estudio Soler</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Gestor de juicios del Estudio Soler">
<!-- Solo se cargan archivos de la propia app; lo único externo es la base de datos (Supabase). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://udfmoxnehgoihzsyrpvy.supabase.co wss://udfmoxnehgoihzsyrpvy.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c2236">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juicios">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="vArranque" class="arranque">Abriendo el gestor…</div>

<main id="vIngreso" class="portada" hidden>
  <section class="caratula" aria-labelledby="tIngreso">
    <div>
      <h1 id="tIngreso"><span class="j">J</span>uicios</h1>
      <div class="estudio">Estudio Soler</div>
    </div>
    <div id="ingresoCuerpo" class="caratula-cuerpo"></div>
  </section>
</main>

<div id="vApp" hidden>
  <div class="app">
    <!-- En la computadora, la barra lateral. En el celular solo quedan las vistas, debajo del buscador. -->
    <div class="lateral">
      <div class="marca" aria-hidden="true"><span class="marca-j">J</span><span class="marca-txt">uicios</span><small>Estudio Soler</small></div>
      <div class="seg" id="vistas" role="group" aria-label="Vista">
        <button id="vLista" aria-pressed="true"><span class="vista-txt">Lista</span></button>
        <button id="vTablero" aria-pressed="false"><span class="vista-txt">Tablero</span></button>
        <button id="vAgenda" aria-pressed="false"><span class="vista-txt">Agenda</span><span class="badge" id="nAgenda" hidden></span></button>
        <button id="vAcuerdos" aria-pressed="false"><span class="vista-txt">Acuerdos</span><span class="badge" id="nAcuerdos" hidden></span></button>
      </div>
      <a class="otra-app" href="cobranzas/" target="_blank" rel="noopener" title="Abrir la app de cobranzas" aria-label="Abrir la app de cobranzas"><span class="otra-c" aria-hidden="true">C</span><span class="otra-txt" aria-hidden="true">Cobranzas</span></a>
    </div>

    <div class="wrap">
      <header>
        <div class="titulos">
          <h1><span class="h-marca"><span class="j">J</span>uicios</span><span class="h-vista" id="tVista">Causas</span></h1>
          <div class="sub" id="sub">Cargando causas…</div>
        </div>
        <div class="actions">
          <button class="btn" id="btnChat" aria-label="Hablar con Claude">Claude</button>
          <!-- Otra pestaña: el gestor queda abierto al lado del SAC. -->
          <a class="btn" id="btnSac" href="https://www.justiciacordoba.gob.ar/JusticiaCordoba/extranet.aspx" target="_blank" rel="noopener" aria-label="Abrir el SAC" title="Abrir el SAC (Servicios Extranet) en otra pestaña">SAC</a>
          <button class="cuenta" id="btnCuenta" aria-haspopup="menu" aria-expanded="false" aria-label="Cuenta y opciones"></button>
        </div>
        <div class="pildoras solo-escritorio">
          <button class="btn primary" id="btnNew">+ Nueva causa</button>
          <button class="btn" id="btnTpl">Plantillas</button>
          <button class="btn" id="btnExport">Exportar a Excel (CSV)</button>
        </div>
      </header>

      <div id="franja"></div>
      <div id="avisos"></div>
      <div class="stats" id="stats"></div>

      <div class="toolbar" id="toolbar">
        <input type="search" id="q" placeholder="Buscar por demandado, actor, expediente o acción…" aria-label="Buscar">
        <button class="btn solo-movil" id="btnFiltros" aria-expanded="false" aria-controls="filtros">Filtros</button>
        <div class="filtros" id="filtros">
        <select id="fEstado" aria-label="Estado"></select>
        <select id="fNom" aria-label="Nominación"></select>
        <select id="fOrden" aria-label="Orden del listado">
          <option value="dias:-1">Más tiempo sin movimiento</option>
          <option value="dias:1">Movimiento más reciente</option>
          <option value="vence:1">Vencimiento más próximo</option>
          <option value="demandado:1">Demandado (A–Z)</option>
          <option value="estado:1">Estado</option>
          <option value="" hidden>Otro orden</option>
        </select>
        </div>
      </div>
      <div class="chips" id="chips"></div>

      <main id="main"></main>
    </div>
  </div>
  <button class="btn primary fab" id="fabNew">+ Nueva causa</button>
</div>

<div id="drawer" hidden></div>
<div id="chat" hidden></div>
<div id="menu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript>El gestor necesita JavaScript para funcionar.</noscript>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
